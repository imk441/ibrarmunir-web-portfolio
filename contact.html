<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black text-gray-100 min-h-screen flex flex-col justify-between">
    
    <!-- NAVIGATION BAR -->
    <nav class="bg-black border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16 gap-2">
                
                <!-- logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-base sm:text-xl font-bold text-blue-500 tracking-tight">
                        PORTFOLIO
                    </a>
                </div>

                <!-- nav-links -->
                <div class="flex space-x-2 sm:space-x-8 items-center justify-center">
                    <a href="index.html" class="text-gray-400 hover:text-blue-400 px-1 py-2 text-xs sm:text-sm font-medium transition-colors">Home</a>
                    <a href="about.html" class="text-gray-400 hover:text-blue-400 px-1 py-2 text-xs sm:text-sm font-medium transition-colors">About</a>
                    <a href="contact.html" class="text-white hover:text-blue-400 px-1 py-2 text-xs sm:text-sm font-medium transition-colors">Contact</a>
                </div>

                <!-- social / github quick button -->
                <div class="flex items-center space-x-1 sm:space-x-4 flex-shrink-0">
                    <a href="https://github.com" target="_blank" class="text-gray-400 hover:text-blue-400 text-xs sm:text-sm font-medium transition-colors px-1.5 py-2">
                        GitHub
                    </a>
                    <a href="contact.html" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-md sm:rounded-lg text-xs sm:text-sm font-medium transition-colors shadow-sm">
                        Hire Me
                    </a>
                </div>

            </div>
        </div>
    </nav>

    <!-- MAIN CONTACT FORM CONTAINER -->
    <main class="flex-1 max-w-xl mx-auto px-4 py-16 w-full flex flex-col justify-center">
        
        <!-- Header Text -->
        <div class="text-center mb-10">
            <h1 class="text-3xl sm:text-4xl font-black text-white tracking-tight">Get In Touch</h1>
            <p class="mt-3 text-xs sm:text-sm text-gray-400">
                Have a game project or internship opportunity? Drop a message below.
            </p>
        </div>

        <!-- FORM MODULE -->
        <form action="https://formspree.io/f/xeaoejvy" method="POST" class="space-y-5 bg-gray-950/30 p-6 sm:p-8 rounded-2xl border border-gray-900 shadow-xl">
            
            <!-- Full Name Input -->
            <div>
                <label for="name" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Ibrar Munir" required
                    class="w-full bg-black border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-gray-600" />
            </div>

            <!-- Email Address Input -->
            <div>
                <label for="email" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" id="email" name="email" placeholder="ibrarmunir@example.com" required
                    class="w-full bg-black border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-gray-600" />
            </div>

            <!-- Subject Input -->
            <div>
                <label for="subject" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="Project Collaboration Opportunity" required
                    class="w-full bg-black border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-gray-600" />
            </div>

            <!-- Message Textarea -->
            <div>
                <label for="message" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Your Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Hi Ibrar, I would love to discuss a Unity game development project..." required
                    class="w-full bg-black border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-gray-600 resize-none"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm py-3 rounded-xl transition-all shadow-md active:scale-[0.99] cursor-pointer">
                    Send Message
                </button>
            </div>

        </form>
    </main>

    <!-- SIMPLE FOOTER WITH NAVIGATION LINKS -->
    <footer class="bg-black border-t border-gray-900 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-6">
            <!-- Left Side: Brand & Copyright Info -->
            <div class="text-center sm:text-left">
                <span class="text-sm font-bold text-white tracking-wider">PORTFOLIO</span>
                <p class="text-xs text-gray-500 mt-1">© 2026 Ibrar Munir. All rights reserved.</p>
            </div>

            <!-- Center Section: Quick Navigation Links -->
            <div class="flex space-x-6 justify-center items-center">
                <a href="index.html" class="text-xs text-gray-400 hover:text-blue-400 transition-colors font-medium">Home</a>
                <a href="about.html" class="text-xs text-gray-400 hover:text-blue-400 transition-colors font-medium">About</a>
                <a href="contact.html" class="text-xs text-white transition-colors font-semibold">Contact</a>
            </div>

            <!-- Right Side: Phone Contact Link -->
            <div class="text-center sm:text-right text-xs text-gray-400">
                <span class="text-gray-500">Contact directly:</span>
                <a href="tel:+923451234581" class="text-blue-400 hover:text-blue-300 hover:underline block mt-0.5">[+92 (345) 1234581](tel:+923451234581)</a>
            </div>
        </div>
    </footer>
</body>

</html>
